# 記錄未配班人員：未來 2 週某時段未配班只剩 1 位專員，記到獨立行事曆
#
# 由 tool-system 的 Cloud Schedule Router 依主控表「排程設定」（功能代號 unassigned_staff_record）
# 派送過來（不用 GitHub cron）。也可以在這裡手動執行。
# 規則見 shared/unassigned_staff_schedule.py：範圍＝明天起 14 天，不算檸檬人。
#
# 需要的 Secrets：SCHEDULE_NOTICE_CALENDAR_ID（排程行事曆 ID，必填）、GOOGLE_SERVICE_ACCOUNT_JSON（執行 Log）、
# GOOGLE_CALENDAR_REFRESH_TOKEN＋GOOGLE_CALENDAR_CLIENT_ID／SECRET（或 GOOGLE_OAUTH_CLIENT_ID／SECRET）、TAIPEI_EMAIL／PASSWORD
name: Unassigned Staff Record Schedule
run-name: ${{ inputs.scheduled_slot && format('cloud-{0}', inputs.scheduled_slot) || 'Unassigned Staff Record Schedule' }}

on:
  workflow_dispatch:
    inputs:
      date: {description: "以這天當作執行日（YYYY-MM-DD，空白＝今天）", required: false, default: "", type: string}
      regions: {description: "地區（逗號分隔，空白＝台北）", required: false, default: "", type: string}
      days: {description: "明天起幾天", required: false, default: "14", type: string}
      env: {description: prod / dev, required: false, default: "prod", type: string}
      dry_run: {description: 只讀班表不寫行事曆, required: false, default: false, type: boolean}
      scheduled_slot: {description: 排程設定派送時段（手動執行請留空）, required: false, default: "", type: string}

permissions:
  contents: read

concurrency:
  group: unassigned-staff-record-schedule
  cancel-in-progress: false

jobs:
  unassigned-staff-record:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12", cache: pip}
      - run: pip install -r requirements.txt
      - name: Record single unassigned staff
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          GOOGLE_CALENDAR_REFRESH_TOKEN: ${{ secrets.GOOGLE_CALENDAR_REFRESH_TOKEN }}
          GOOGLE_CALENDAR_CLIENT_ID: ${{ secrets.GOOGLE_CALENDAR_CLIENT_ID }}
          GOOGLE_CALENDAR_CLIENT_SECRET: ${{ secrets.GOOGLE_CALENDAR_CLIENT_SECRET }}
          GOOGLE_OAUTH_CLIENT_ID: ${{ secrets.GOOGLE_OAUTH_CLIENT_ID }}
          GOOGLE_OAUTH_CLIENT_SECRET: ${{ secrets.GOOGLE_OAUTH_CLIENT_SECRET }}
          SCHEDULE_NOTICE_CALENDAR_ID: ${{ secrets.SCHEDULE_NOTICE_CALENDAR_ID }}
          TAIPEI_EMAIL: ${{ secrets.TAIPEI_EMAIL }}
          TAIPEI_PASSWORD: ${{ secrets.TAIPEI_PASSWORD }}
          TAICHUNG_EMAIL: ${{ secrets.TAICHUNG_EMAIL }}
          TAICHUNG_PASSWORD: ${{ secrets.TAICHUNG_PASSWORD }}
          RUN_DATE: ${{ inputs.date }}
          RUN_ENV: ${{ inputs.env || 'prod' }}
          REGIONS: ${{ inputs.regions }}
          DAYS: ${{ inputs.days || '14' }}
          DRY_RUN: ${{ inputs.dry_run && '--dry-run' || '' }}
        run: python -u -m shared.unassigned_staff_schedule --env "$RUN_ENV" --date "$RUN_DATE" --days "$DAYS" ${REGIONS:+--regions "$REGIONS"} $DRY_RUN
