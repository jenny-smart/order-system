# 客人備註非空白：上班日 10:00 貼到台北／台中內勤工作表單「客人備註」分頁＋記行事曆
#
# 由 tool-system 的 Cloud Schedule Router 依主控表「排程設定」（功能代號 customer_memo_daily）
# 派送過來（不用 GitHub cron：新加的 GitHub 排程常延遲或不跑）。也可以在這裡手動執行。
# 規則見 shared/customer_memo_schedule.py：區間＝前一上班日 10:00～今天 10:00（訂購時間），
# 全部付款狀態、排除代客預訂、客人備註非空白；非上班日直接結束。
#
# 需要的 Secrets：GOOGLE_SERVICE_ACCOUNT_JSON、TAIPEI_EMAIL／PASSWORD、TAICHUNG_EMAIL／PASSWORD
# 行事曆用服務帳號寫入，服務帳號要有 jenny@hers.com.tw（或 jenny@lemonclean.com.tw）行事曆的編輯權限。
name: Customer Memo Schedule
run-name: ${{ inputs.scheduled_slot && format('cloud-{0}', inputs.scheduled_slot) || format('Customer Memo Schedule {0}', inputs.date) }}

on:
  workflow_dispatch:
    inputs:
      date: {description: "以這天當作執行日（YYYY-MM-DD，空白＝今天）", required: false, default: "", type: string}
      env: {description: prod / dev, required: false, default: "prod", type: string}
      dry_run: {description: 只查詢不寫入工作表與行事曆, required: false, default: false, type: boolean}
      scheduled_slot: {description: 排程設定派送時段（手動執行請留空）, required: false, default: "", type: string}

permissions:
  contents: read

concurrency:
  group: customer-memo-schedule
  cancel-in-progress: false

jobs:
  customer-memo:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12", cache: pip}
      - run: pip install -r requirements.txt
      - name: Paste customer memo orders and add calendar event
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          TAIPEI_EMAIL: ${{ secrets.TAIPEI_EMAIL }}
          TAIPEI_PASSWORD: ${{ secrets.TAIPEI_PASSWORD }}
          TAICHUNG_EMAIL: ${{ secrets.TAICHUNG_EMAIL }}
          TAICHUNG_PASSWORD: ${{ secrets.TAICHUNG_PASSWORD }}
          CUSTOMER_MEMO_CALENDAR_ID: ${{ vars.CUSTOMER_MEMO_CALENDAR_ID }}
          RUN_DATE: ${{ inputs.date }}
          RUN_ENV: ${{ inputs.env || 'prod' }}
          DRY_RUN: ${{ inputs.dry_run && '--dry-run' || '' }}
        run: python -u -m shared.customer_memo_schedule --env "$RUN_ENV" --date "$RUN_DATE" $DRY_RUN
