name: Completed Notice Cloud
run-name: Completed Notice Cloud (${{ inputs.env || 'prod' }}) ${{ inputs.sheet_name }}
on:
  workflow_dispatch:
    inputs:
      sheet_name: {description: Sheet tab name, required: true, type: string}
      rows: {description: Optional row selection, required: false, default: "", type: string}
      env: {description: prod / dev, required: false, default: "prod", type: string}
concurrency:
  group: completed-notice-cloud-${{ inputs.env == 'dev' && 'dev' || 'prod' }}
  cancel-in-progress: false
jobs:
  notice:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12", cache: pip}
      - run: pip install -r requirements.txt
      - name: Generate and write completed notices
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          TAIPEI_EMAIL: ${{ secrets.TAIPEI_EMAIL }}
          TAIPEI_PASSWORD: ${{ secrets.TAIPEI_PASSWORD }}
          TAICHUNG_EMAIL: ${{ secrets.TAICHUNG_EMAIL }}
          TAICHUNG_PASSWORD: ${{ secrets.TAICHUNG_PASSWORD }}
          TAOYUAN_EMAIL: ${{ secrets.TAOYUAN_EMAIL }}
          TAOYUAN_PASSWORD: ${{ secrets.TAOYUAN_PASSWORD }}
          HSINCHU_EMAIL: ${{ secrets.HSINCHU_EMAIL }}
          HSINCHU_PASSWORD: ${{ secrets.HSINCHU_PASSWORD }}
          KAOHSIUNG_EMAIL: ${{ secrets.KAOHSIUNG_EMAIL }}
          KAOHSIUNG_PASSWORD: ${{ secrets.KAOHSIUNG_PASSWORD }}
        run: python -m shared.cloud_completed_notice --sheet "${{ inputs.sheet_name }}" --rows "${{ inputs.rows }}" --env "${{ inputs.env }}" --batch-size 8
