# 檸檬人統計（待換專員進度）：每日 11:00 統計台北訂單裡的檸檬人，記入行事曆
#
# 由 tool-system 的 Cloud Schedule Router 依主控表「排程設定」（功能代號 lemon_ren_count）
# 派送過來（不用 GitHub cron）。也可以在這裡手動執行。
# 規則見 shared/lemon_ren_count_schedule.py：統計範圍＝當月 1 日～＋3 個月的月底，
# 結果記獨立行事曆 SCHEDULE_NOTICE_CALENDAR_ID（不再寫 tpe@、jenny@）。
#
# 需要的 Secrets：GOOGLE_SERVICE_ACCOUNT_JSON（執行 Log）、GOOGLE_CALENDAR_REFRESH_TOKEN＋
# GOOGLE_CALENDAR_CLIENT_ID／SECRET（或 GOOGLE_OAUTH_CLIENT_ID／SECRET）、TAIPEI_EMAIL／PASSWORD
name: Lemon-Ren Count Schedule
run-name: ${{ inputs.scheduled_slot && format('cloud-{0}', inputs.scheduled_slot) || 'Lemon-Ren Count Schedule' }}

on:
  workflow_dispatch:
    inputs:
      date: {description: "以這天當作執行日（YYYY-MM-DD，空白＝今天）", required: false, default: "", type: string}
      regions: {description: "地區（逗號分隔，空白＝台北）", required: false, default: "", type: string}
      months: {description: "統計到當月＋幾個月的月底", required: false, default: "3", type: string}
      env: {description: prod / dev, required: false, default: "prod", type: string}
      dry_run: {description: 只統計不寫行事曆, required: false, default: false, type: boolean}
      scheduled_slot: {description: 排程設定派送時段（手動執行請留空）, required: false, default: "", type: string}

permissions:
  contents: read

concurrency:
  group: lemon-ren-count-schedule
  cancel-in-progress: false

jobs:
  lemon-ren-count:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12", cache: pip}
      - run: pip install -r requirements.txt
      - name: Count lemon-ren in orders
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          GOOGLE_CALENDAR_REFRESH_TOKEN: ${{ secrets.GOOGLE_CALENDAR_REFRESH_TOKEN }}
          GOOGLE_CALENDAR_CLIENT_ID: ${{ secrets.GOOGLE_CALENDAR_CLIENT_ID }}
          GOOGLE_CALENDAR_CLIENT_SECRET: ${{ secrets.GOOGLE_CALENDAR_CLIENT_SECRET }}
          GOOGLE_OAUTH_CLIENT_ID: ${{ secrets.GOOGLE_OAUTH_CLIENT_ID }}
          GOOGLE_OAUTH_CLIENT_SECRET: ${{ secrets.GOOGLE_OAUTH_CLIENT_SECRET }}
          SCHEDULE_NOTICE_CALENDAR_ID: ${{ secrets.SCHEDULE_NOTICE_CALENDAR_ID }}
          TAIPEI_EMAIL: ${{ secrets.TAIPEI_EMAIL }}
          TAIPEI_PASSWORD: ${{ secrets.TAIPEI_PASSWORD }}
          RUN_DATE: ${{ inputs.date }}
          RUN_ENV: ${{ inputs.env || 'prod' }}
          REGIONS: ${{ inputs.regions }}
          MONTHS: ${{ inputs.months || '3' }}
          DRY_RUN: ${{ inputs.dry_run && '--dry-run' || '' }}
        run: python -u -m shared.lemon_ren_count_schedule --env "$RUN_ENV" --date "$RUN_DATE" --months "$MONTHS" ${REGIONS:+--regions "$REGIONS"} $DRY_RUN
